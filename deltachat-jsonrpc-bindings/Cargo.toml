[package]
name = "deltachat-jsonrpc-bindings"
version = "2.65.0"
description = "Autogenerate DeltaChat JSON-RPC API bindings at build time"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/chatmail/core"

# Workaround: Add a dummy cdylib so that cargo-lipo can build this for iOS
[lib]
name = "dummy"
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
deltachat-jsonrpc = { workspace = true }

[dependencies]

[features]
default = ["vendored"]
vendored = ["deltachat-jsonrpc/vendored"]
